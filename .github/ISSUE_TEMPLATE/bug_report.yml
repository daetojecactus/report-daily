name: Bug report
description: Something in the bot works wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave tokens, chat IDs and other people's data out of the report. For a security problem, [report it privately](https://github.com/daetojecactus/report-daily/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release in `REPORT_DAILY_VERSION`, such as `1.0.0`, or the commit when built from the sources.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How the bot runs
      options:
        - Docker Compose
        - Without Docker
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      multiple: true
      options:
        - Telegram
        - Slack
        - Not about a channel
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI
      options:
        - 'Off'
        - Claude API
        - OpenAI-compatible API
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you did, what you expected and what the bot did instead. For a wrong report line, give the line and what the employee did in GitLab.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines around the problem from `docker compose logs app`.
      render: text
