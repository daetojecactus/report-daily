version: '3.8'

services:
  report-daily-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: report-daily-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Aqtau}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
