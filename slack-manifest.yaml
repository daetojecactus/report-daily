display_information:
  name: Report Daily
  description: Daily work reports from your team activity
  background_color: '#1f2933'
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Report Daily
    always_online: true
  slash_commands:
    - command: /report-daily
      description: Open the report bot
      usage_hint: '[report | settings | admin | help | cancel]'
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
